<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Neuralab</title>
  <meta name="description" content="Sign in or register for Neuralab engineering tracks and interactive workspaces.">
  <link rel="stylesheet" href="assets/css/neuralab.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23000%22/><text y=%22.75em%22 x=%2250%25%22 text-anchor=%22middle%22 font-size=%2260%22 fill=%22%23fff%22 font-family=%22sans-serif%22 font-weight=%22bold%22>N</text></svg>">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="assets/js/firebase-auth.js"></script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; background:#000000;">

  <div class="card" style="max-width:420px; width:100%; padding:2.5rem 2rem; background:#0d0d10; border:1px solid #222226; border-radius:8px;">
    <!-- Brand Header -->
    <div style="text-align:center; margin-bottom:2rem;">
      <a href="index.html" style="display:inline-block; text-decoration:none; color:#fff; font-size:1.4rem; font-weight:700; letter-spacing:-0.02em;">
        Neuralab
      </a>
      <p style="color:#71717a; font-size:0.88rem; margin-top:0.35rem;">Student & Engineer Portal</p>
    </div>

    <!-- Tab Selector -->
    <div style="display:flex; background:#141417; padding:0.25rem; border-radius:6px; margin-bottom:1.75rem; border:1px solid #222226;">
      <button id="tabLogin" class="btn" style="flex:1; background:#a3e635; color:#000000; border-radius:4px; font-size:0.85rem; font-weight:700; padding:0.45rem;">Sign In</button>
      <button id="tabRegister" class="btn" style="flex:1; background:transparent; color:#71717a; border-radius:4px; font-size:0.85rem; padding:0.45rem;">Register</button>
    </div>

    <!-- Alert Message -->
    <div id="authAlert" style="display:none; padding:0.75rem 1rem; border-radius:6px; font-size:0.85rem; margin-bottom:1.25rem;"></div>

    <!-- Google Identity Provider Button -->
    <div style="margin-bottom:1.5rem;">
      <button id="googleSignInBtn" type="button" class="btn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.75rem; background:#141417; border:1px solid #28282e; color:#ffffff; padding:0.75rem; border-radius:6px; font-weight:600; font-size:0.9rem; transition:var(--transition); cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>
      <div style="display:flex; align-items:center; margin:1.25rem 0; color:#52525b; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em;">
        <div style="flex:1; height:1px; background:#222226;"></div>
        <span style="padding:0 0.75rem;">or use email</span>
        <div style="flex:1; height:1px; background:#222226;"></div>
      </div>
    </div>

    <!-- Student Sign In Form -->
    <form id="loginForm">
      <div class="form-group" style="margin-bottom:1.15rem;">
        <label class="form-label" for="loginEmail" style="color:#a1a1aa; font-size:0.8rem; margin-bottom:0.35rem;">Email address</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="engineer@example.com" required style="background:#141417; border-color:#27272a; border-radius:6px; padding:0.7rem 0.9rem;">
      </div>

      <div class="form-group" style="margin-bottom:1.5rem;">
        <label class="form-label" for="loginPassword" style="color:#a1a1aa; font-size:0.8rem; margin-bottom:0.35rem;">Password</label>
        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required style="background:#141417; border-color:#27272a; border-radius:6px; padding:0.7rem 0.9rem;">
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width:100%; padding:0.75rem; border-radius:6px;">
        Sign In
      </button>
    </form>

    <!-- Student Registration Form -->
    <form id="registerForm" style="display:none;">
      <div class="form-group" style="margin-bottom:1.15rem;">
        <label class="form-label" for="regName" style="color:#a1a1aa; font-size:0.8rem; margin-bottom:0.35rem;">Full name</label>
        <input type="text" id="regName" class="form-input" placeholder="Alex Chen" required style="background:#141417; border-color:#27272a; border-radius:6px; padding:0.7rem 0.9rem;">
      </div>

      <div class="form-group" style="margin-bottom:1.15rem;">
        <label class="form-label" for="regEmail" style="color:#a1a1aa; font-size:0.8rem; margin-bottom:0.35rem;">Email address</label>
        <input type="email" id="regEmail" class="form-input" placeholder="alex@domain.com" required style="background:#141417; border-color:#27272a; border-radius:6px; padding:0.7rem 0.9rem;">
      </div>

      <div class="form-group" style="margin-bottom:1.5rem;">
        <label class="form-label" for="regPassword" style="color:#a1a1aa; font-size:0.8rem; margin-bottom:0.35rem;">Password (Min. 8 characters)</label>
        <input type="password" id="regPassword" class="form-input" placeholder="••••••••" minlength="8" required style="background:#141417; border-color:#27272a; border-radius:6px; padding:0.7rem 0.9rem;">
      </div>

      <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width:100%; padding:0.75rem; border-radius:6px;">
        Create Account
      </button>
    </form>

    <!-- Hidden / Gated Admin Access Link -->
    <div style="margin-top:2rem; padding-top:1.25rem; border-top:1px solid #1f1f23; text-align:center;">
      <button id="openAdminRequestBtn" style="background:none; border:none; color:#52525b; font-size:0.75rem; cursor:pointer; font-family:var(--font-sans);">
        Request Administrator Verification &rarr;
      </button>
    </div>
  </div>

  <!-- Multi-Step Admin Verification & Approval Modal -->
  <div id="adminRequestModal" class="modal-overlay">
    <div class="modal-content" style="max-width:460px; background:#121215; border:1px solid #28282e;">
      <div class="modal-header">
        <h3 class="modal-title">Administrator Verification Gate</h3>
        <button id="closeAdminModalBtn" class="modal-close">&times;</button>
      </div>
      <form id="adminRequestForm">
        <div class="modal-body">
          <p style="font-size:0.85rem; color:#a1a1aa; line-height:1.6; margin-bottom:1.25rem;">
            Admin privileges require explicit authorization. Submitting this form dispatches a security alert and approval request to platform owner <strong>Anay Upadhyay</strong>.
          </p>

          <div class="form-group" style="margin-bottom:1rem;">
            <label class="form-label" for="reqAdminName" style="color:#a1a1aa; font-size:0.8rem;">Your Name</label>
            <input type="text" id="reqAdminName" class="form-input" placeholder="Anay Upadhyay" required style="background:#18181c; border-color:#27272a;">
          </div>

          <div class="form-group" style="margin-bottom:1rem;">
            <label class="form-label" for="reqAdminEmail" style="color:#a1a1aa; font-size:0.8rem;">Your Email</label>
            <input type="email" id="reqAdminEmail" class="form-input" placeholder="admin@neuralab.dev" required style="background:#18181c; border-color:#27272a;">
          </div>

          <div class="form-group" style="margin-bottom:1rem;">
            <label class="form-label" for="reqAdminPassphrase" style="color:#a1a1aa; font-size:0.8rem;">Master Verification Passphrase (Optional for instant elevation)</label>
            <input type="password" id="reqAdminPassphrase" class="form-input" placeholder="••••••••" style="background:#18181c; border-color:#27272a;">
          </div>

          <div class="form-group">
            <label class="form-label" for="reqAdminReason" style="color:#a1a1aa; font-size:0.8rem;">Justification / Reason</label>
            <textarea id="reqAdminReason" class="form-textarea" rows="2" placeholder="Local development / Production administration" style="background:#18181c; border-color:#27272a;"></textarea>
          </div>
        </div>

        <div style="padding:1rem 1.75rem; border-top:1px solid #1f1f23; display:flex; justify-content:flex-end; gap:0.75rem; background:#0d0d10;">
          <button type="button" id="cancelAdminReqBtn" class="btn btn-secondary btn-sm">Cancel</button>
          <button type="submit" id="submitAdminReqBtn" class="btn btn-primary btn-sm">Dispatch Request</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const authAlert = document.getElementById('authAlert');

    function showAlert(msg, isSuccess = false) {
      authAlert.style.display = 'block';
      authAlert.style.background = isSuccess ? 'rgba(163, 230, 53, 0.1)' : 'rgba(239, 68, 68, 0.1)';
      authAlert.style.border = `1px solid ${isSuccess ? '#a3e635' : '#ef4444'}`;
      authAlert.style.color = isSuccess ? '#bef264' : '#f87171';
      authAlert.textContent = msg;
    }

    tabLogin.addEventListener('click', () => {
      tabLogin.style.background = '#a3e635';
      tabLogin.style.color = '#000000';
      tabLogin.style.fontWeight = '700';
      tabRegister.style.background = 'transparent';
      tabRegister.style.color = '#71717a';
      tabRegister.style.fontWeight = 'normal';
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
      authAlert.style.display = 'none';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.style.background = '#a3e635';
      tabRegister.style.color = '#000000';
      tabRegister.style.fontWeight = '700';
      tabLogin.style.background = 'transparent';
      tabLogin.style.color = '#71717a';
      tabLogin.style.fontWeight = 'normal';
      registerForm.style.display = 'block';
      loginForm.style.display = 'none';
      authAlert.style.display = 'none';
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'register') {
      tabRegister.click();
    }

    // Check for redirect result on return from Google Auth redirect
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (window.NeuralabFirebase) {
          await window.NeuralabFirebase.init();
          if (window.NeuralabFirebase.auth) {
            const res = await window.NeuralabFirebase.auth.getRedirectResult();
            if (res && res.user) {
              const u = await window.NeuralabFirebase.syncAndFetchUser(res.user);
              showAlert(`Welcome back, ${u.name}! Synchronized with Firebase. Redirecting...`, true);
              const cleanRedirect = (urlParams.get('redirect') || '').replace(/^\//, '');
              const targetRedirect = cleanRedirect || (u.role === 'admin' ? 'admin.html' : 'neural-platform.html');
              setTimeout(() => window.location.href = targetRedirect, 600);
              return;
            }
          }
        }
      } catch (err) {
        console.warn('Redirect auth check notice:', err);
      }
    });

    // Google Identity Provider Sign In
    document.getElementById('googleSignInBtn')?.addEventListener('click', async () => {
      showAlert('Connecting to Google Identity...', true);
      const btn = document.getElementById('googleSignInBtn');
      btn.style.opacity = '0.6';
      btn.style.pointerEvents = 'none';

      try {
        const user = await window.NeuralabFirebase.loginWithGoogle();
        if (user) {
          showAlert(`Authenticated as ${user.name}. Name saved to Firebase Database! Redirecting...`, true);
          const cleanRedirect = (urlParams.get('redirect') || '').replace(/^\//, '');
          const targetRedirect = cleanRedirect || (user.role === 'admin' ? 'admin.html' : 'neural-platform.html');
          setTimeout(() => window.location.href = targetRedirect, 600);
        }
      } catch (err) {
        console.error('Google Sign In Error:', err);
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';

        if (err.code === 'auth/unauthorized-domain') {
          showAlert(`Domain authorization required: Add "${window.location.hostname}" in Firebase Console > Authentication > Settings > Authorized Domains. Alternatively, use Email Sign In below.`);
        } else if (err.code === 'auth/popup-closed-by-user') {
          showAlert('Sign-in cancelled. Click "Continue with Google" to retry.');
        } else {
          showAlert(err.message || 'Google authentication failed. Please try again.');
        }
      }
    });

    // Student Login Submission (Firebase Auth + DB Sync)
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Authenticating with Firebase...';

      const emailVal = document.getElementById('loginEmail').value.trim();
      const passVal = document.getElementById('loginPassword').value;

      try {
        // 1. Try Firebase Authentication
        const user = await window.NeuralabFirebase.loginWithEmail(emailVal, passVal);
        showAlert(`Welcome back, ${user.name}! Verified via Firebase. Redirecting...`, true);
        const cleanRedirect = (urlParams.get('redirect') || '').replace(/^\//, '');
        const targetRedirect = cleanRedirect || (user.role === 'admin' ? 'admin.html' : 'neural-platform.html');
        setTimeout(() => window.location.href = targetRedirect, 600);
        return;
      } catch (fbErr) {
        console.warn('Firebase Login Error, checking fallback:', fbErr);

        // Try local server API if running
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailVal, password: passVal })
          });
          if (res.ok) {
            const data = await res.json();
            if (data.token) {
              window.NeuralabFirebase.cacheUserLocally(data.user);
              showAlert('Authenticated successfully. Redirecting...', true);
              const cleanRedirect = (urlParams.get('redirect') || '').replace(/^\//, '');
              const targetRedirect = cleanRedirect || (data.user.role === 'admin' ? 'admin.html' : 'neural-platform.html');
              setTimeout(() => window.location.href = targetRedirect, 600);
              return;
            }
          }
        } catch (apiErr) {}

        if (fbErr.code === 'auth/user-not-found' || fbErr.code === 'auth/invalid-credential' || fbErr.code === 'auth/wrong-password') {
          showAlert('Invalid credentials. If this is your first time, click Register or Continue with Google.');
        } else {
          showAlert(fbErr.message || 'Authentication error.');
        }
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Student Registration Submission (Firebase Auth + DB Sync)
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account & saving to Firebase DB...';

      const nameVal = document.getElementById('regName').value.trim();
      const emailVal = document.getElementById('regEmail').value.trim();
      const passVal = document.getElementById('regPassword').value;

      try {
        // 1. Register with Firebase and write directly to Firestore & Realtime DB
        const user = await window.NeuralabFirebase.registerWithEmail(nameVal, emailVal, passVal);
        showAlert(`Account created for ${user.name}! Saved directly to Firebase Database. Redirecting...`, true);
        const cleanRedirect = (urlParams.get('redirect') || '').replace(/^\//, '');
        const targetRedirect = cleanRedirect || 'neural-platform.html';
        setTimeout(() => window.location.href = targetRedirect, 600);
        return;
      } catch (fbErr) {
        console.warn('Firebase Register Error, checking fallback:', fbErr);

        // Try local server API if running
        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: nameVal, email: emailVal, password: passVal })
          });
          if (res.ok) {
            const data = await res.json();
            if (data.token) {
              window.NeuralabFirebase.cacheUserLocally(data.user);
              showAlert('Account created successfully. Redirecting...', true);
              const cleanRedirect = (urlParams.get('redirect') || '').replace(/^\//, '');
              const targetRedirect = cleanRedirect || 'neural-platform.html';
              setTimeout(() => window.location.href = targetRedirect, 600);
              return;
            }
          }
        } catch (apiErr) {}

        showAlert(fbErr.message || 'Registration failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });

    // Admin Request Modal Handling
    const adminModal = document.getElementById('adminRequestModal');
    document.getElementById('openAdminRequestBtn').addEventListener('click', () => adminModal.classList.add('active'));
    document.getElementById('closeAdminModalBtn').addEventListener('click', () => adminModal.classList.remove('active'));
    document.getElementById('cancelAdminReqBtn').addEventListener('click', () => adminModal.classList.remove('active'));

    document.getElementById('adminRequestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitAdminReqBtn');
      btn.disabled = true;
      btn.textContent = 'Dispatching alert...';

      const payload = {
        name: document.getElementById('reqAdminName').value.trim(),
        email: document.getElementById('reqAdminEmail').value.trim(),
        masterPassphrase: document.getElementById('reqAdminPassphrase').value,
        justification: document.getElementById('reqAdminReason').value.trim()
      };

      try {
        const res = await fetch('/api/admin/request-access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        adminModal.classList.remove('active');
        showAlert(data.message, data.status === 'APPROVED');
        if (data.status === 'APPROVED') {
          setTimeout(() => {
            document.getElementById('loginEmail').value = payload.email;
            document.getElementById('loginPassword').value = payload.masterPassphrase;
            tabLogin.click();
          }, 1200);
        }
      } catch (err) {
        alert('Could not dispatch admin verification request: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Dispatch Request';
      }
    });
  </script>
</body>
</html>
