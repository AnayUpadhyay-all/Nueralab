<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuralab Code Studio | Interactive Compiler & Systems Sandbox</title>
  <link rel="stylesheet" href="/assets/css/neuralab.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
  <style>
    .studio-layout {
      display: grid;
      grid-template-columns: 240px 1fr 380px;
      height: calc(100vh - 65px);
      background: #06080d;
      overflow: hidden;
    }
    .file-tree {
      background: #090d14;
      border-right: 1px solid var(--border-subtle);
      padding: 1rem 0;
      font-size: 0.88rem;
    }
    .file-item {
      padding: 0.5rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
    }
    .file-item:hover, .file-item.active {
      background: rgba(0, 242, 254, 0.08);
      color: var(--accent-cyan);
    }
    .editor-pane {
      display: flex;
      flex-direction: column;
      background: #06080d;
    }
    .editor-tabs {
      background: #090d14;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
    }
    .tab {
      padding: 0.65rem 1.25rem;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      background: #0d121c;
      color: var(--text-primary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .code-area {
      flex: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      line-height: 1.6;
      padding: 1.25rem;
      outline: none;
      resize: none;
      white-space: pre;
    }
    .terminal-pane {
      background: #05070a;
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
    }
    .terminal-header {
      background: #090d14;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }
    .terminal-body {
      flex: 1;
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #a7f3d0;
      overflow-y: auto;
      line-height: 1.5;
    }
    @media (max-width: 900px) {
      .studio-layout { grid-template-columns: 1fr; height: auto; }
      .file-tree { display: none; }
      .terminal-pane { height: 300px; }
      .code-area { height: 400px; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">💻</div>
      <span>Neuralab Code Studio</span>
    </a>
    <div style="display:flex; align-items:center; gap:1rem;">
      <select id="langSelector" class="form-select" style="padding:0.35rem 0.8rem; font-size:0.85rem; width:auto;">
        <option value="cpp">C++23 (Clang 18 / SIMD)</option>
        <option value="rust">Rust 1.78 (Borrow Checker)</option>
        <option value="python">Python 3.13 (No-GIL)</option>
        <option value="js">JavaScript (V8 Engine)</option>
      </select>
      <button id="runCodeBtn" class="btn btn-primary btn-sm">▶ Execute / Compile</button>
      <a href="/" class="btn btn-secondary btn-sm">Exit Studio</a>
    </div>
  </header>

  <!-- Studio Layout -->
  <div class="studio-layout">
    <!-- File Explorer -->
    <div class="file-tree">
      <div style="padding:0 1.25rem 0.75rem; font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; font-family:var(--font-mono); letter-spacing:0.5px;">
        WORKSPACE REPOSITORY
      </div>
      <div class="file-item active" data-file="main.cpp">
        <span>⚡</span> <span>main.cpp</span>
      </div>
      <div class="file-item" data-file="engine.rs">
        <span>🦀</span> <span>engine.rs</span>
      </div>
      <div class="file-item" data-file="attention.py">
        <span>🧠</span> <span>attention.py</span>
      </div>
      <div class="file-item" data-file="runtime.js">
        <span>⚙️</span> <span>runtime.js</span>
      </div>
    </div>

    <!-- Code Editor -->
    <div class="editor-pane">
      <div class="editor-tabs">
        <div id="activeTabName" class="tab">
          <span>⚡</span> <span>main.cpp</span>
        </div>
      </div>
      <textarea id="codeEditorInput" class="code-area" spellcheck="false"></textarea>
    </div>

    <!-- Output Terminal -->
    <div class="terminal-pane">
      <div class="terminal-header">
        <span>TERMINAL • STDOUT / STDERR</span>
        <button id="clearTerminalBtn" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.75rem;">Clear</button>
      </div>
      <div id="terminalBody" class="terminal-body">
        <span style="color:var(--text-muted);">// Neuralab Sandbox compiler ready.</span><br>
        <span style="color:var(--text-muted);">// Click "Execute / Compile" to compile and run the active file.</span>
      </div>
    </div>
  </div>

  <script>
    const FILES = {
      'main.cpp': {
        lang: 'cpp',
        code: `#include <iostream>
#include <vector>
#include <chrono>
#include <immintrin.h>

// Demonstrating SIMD 256-bit Vectorized Dot Product
void simd_vector_dot() {
    alignas(32) float a[8] = {1.0f, 2.0f, 3.0f, 4.0f, 5.0f, 6.0f, 7.0f, 8.0f};
    alignas(32) float b[8] = {2.0f, 2.0f, 2.0f, 2.0f, 2.0f, 2.0f, 2.0f, 2.0f};

    __m256 va = _mm256_load_ps(a);
    __m256 vb = _mm256_load_ps(b);
    __m256 prod = _mm256_mul_ps(va, vb);

    alignas(32) float result[8];
    _mm256_store_ps(result, prod);

    float sum = 0.0f;
    for (int i = 0; i < 8; ++i) sum += result[i];

    std::cout << "[SIMD AVX2] Computed 8-lane dot product: " << sum << std::endl;
}

int main() {
    std::cout << "--- Neuralab Modern C++23 Low-Level Runtime ---" << std::endl;
    simd_vector_dot();
    std::cout << "[Memory] Allocator latency: 4.2 nanoseconds." << std::endl;
    return 0;
}`
      },
      'engine.rs': {
        lang: 'rust',
        code: `// Rust Core: Fearless Concurrency & Zero-Allocation Channels
use std::sync::mpsc;
use std::thread;
use std::time::Duration;

struct NeuralPacket {
    sequence_id: u64,
    payload: Vec<u8>,
}

fn main() {
    println!("--- Neuralab Safe Concurrency Engine (Rust) ---");
    let (tx, rx) = mpsc::channel();

    let worker = thread::spawn(move || {
        for i in 0..3 {
            let packet = NeuralPacket {
                sequence_id: i,
                payload: vec![0xCA, 0xFE, 0xBA, 0xBE],
            };
            tx.send(packet).unwrap();
            thread::sleep(Duration::from_millis(50));
        }
    });

    for packet in rx {
        println!("[Worker] Received sequence #{}: {} bytes verified", packet.sequence_id, packet.payload.len());
    }

    worker.join().unwrap();
    println!("[Borrow Checker] Zero data races detected.");
}`
      },
      'attention.py': {
        lang: 'python',
        code: `# Neuralab Transformer Multi-Head Self-Attention Derivation
import math

def scaled_dot_product_attention(Q, K, V):
    """
    Q, K, V: lists of vectors representing Query, Key, Value
    Computes: softmax(Q @ K.T / sqrt(d_k)) @ V
    """
    d_k = len(Q[0])
    scale = 1.0 / math.sqrt(d_k)
    
    # Compute dot products Q @ K.T
    scores = []
    for q in Q:
        row = []
        for k in K:
            dot = sum(x * y for x, y in zip(q, k)) * scale
            row.append(dot)
        # Softmax over row
        max_val = max(row)
        exp_row = [math.exp(x - max_val) for x in row]
        sum_exp = sum(exp_row)
        softmax_row = [x / sum_exp for x in exp_row]
        scores.append(softmax_row)

    print(f"[Transformer Core] Attention matrix computed ({len(scores)}x{len(scores[0])})")
    print(f"[Sparsity] Attention weight (0,0): {scores[0][0]:.4f}")
    return scores

if __name__ == '__main__':
    Q = [[0.5, 0.2, 0.1], [0.1, 0.8, 0.3]]
    K = [[0.4, 0.1, 0.2], [0.2, 0.7, 0.1]]
    V = [[1.0, 0.0], [0.0, 1.0]]
    scaled_dot_product_attention(Q, K, V)`
      },
      'runtime.js': {
        lang: 'js',
        code: `// V8 Engine JIT Warmup & Monomorphic Call-Site Optimization
function Point(x, y) {
  this.x = x;
  this.y = y;
}

function calculateDistanceSquared(p1, p2) {
  // Monomorphic IC: Hidden class remains stable
  const dx = p1.x - p2.x;
  const dy = p1.y - p2.y;
  return dx * dx + dy * dy;
}

console.log("[V8 Runtime] Warming up TurboFan JIT compiler...");
const start = performance.now();
for (let i = 0; i < 1_000_000; i++) {
  const p1 = new Point(i, i + 1);
  const p2 = new Point(i + 2, i + 3);
  calculateDistanceSquared(p1, p2);
}
const elapsed = (performance.now() - start).toFixed(2);
console.log(\`[TurboFan] 1,000,000 invocations optimized in \${elapsed} ms.\`);
console.log("[GC] Scavenge Young Generation: 0ms pauses.");`
      }
    };

    let currentFile = 'main.cpp';
    const editor = document.getElementById('codeEditorInput');
    const tabName = document.getElementById('activeTabName');
    const langSelector = document.getElementById('langSelector');
    const terminal = document.getElementById('terminalBody');

    function loadFile(filename) {
      currentFile = filename;
      const f = FILES[filename];
      editor.value = f.code;
      tabName.innerHTML = `<span>${filename.endsWith('cpp') ? '⚡' : filename.endsWith('rs') ? '🦀' : filename.endsWith('py') ? '🧠' : '⚙️'}</span> <span>${filename}</span>`;
      langSelector.value = f.lang;

      document.querySelectorAll('.file-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-file') === filename);
      });
    }

    loadFile('main.cpp');

    document.querySelectorAll('.file-item').forEach(el => {
      el.addEventListener('click', () => {
        const file = el.getAttribute('data-file');
        loadFile(file);
      });
    });

    document.getElementById('clearTerminalBtn').addEventListener('click', () => {
      terminal.innerHTML = '<span style="color:var(--text-muted);">// Terminal buffer cleared.</span>';
    });

    document.getElementById('runCodeBtn').addEventListener('click', () => {
      terminal.innerHTML += `<br><span style="color:var(--accent-cyan);">&gt; Compiling and executing ${currentFile}...</span><br>`;

      // If JavaScript, run directly in secure sandbox context
      if (currentFile === 'runtime.js') {
        try {
          const logs = [];
          const originalLog = console.log;
          console.log = (...args) => logs.push(args.join(' '));
          
          eval(editor.value);
          console.log = originalLog;

          logs.forEach(l => {
            terminal.innerHTML += `<span style="color:#a7f3d0;">${l}</span><br>`;
          });
        } catch (err) {
          terminal.innerHTML += `<span style="color:var(--accent-red);">Runtime Error: ${err.message}</span><br>`;
        }
      } else {
        // High fidelity mock compiler output for C++, Rust, Python
        setTimeout(() => {
          if (currentFile === 'main.cpp') {
            terminal.innerHTML += `<span style="color:#60a5fa;">[clang-18] target: x86_64-unknown-linux-gnu -O3 -mavx2</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">--- Neuralab Modern C++23 Low-Level Runtime ---</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">[SIMD AVX2] Computed 8-lane dot product: 72</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">[Memory] Allocator latency: 4.2 nanoseconds.</span><br>`;
            terminal.innerHTML += `<span style="color:var(--accent-green);">&gt; Program exited with code 0 (clean).</span><br>`;
          } else if (currentFile === 'engine.rs') {
            terminal.innerHTML += `<span style="color:#60a5fa;">[rustc 1.78.0] Compiling nueralab_core v2.0.0 (--release)</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">--- Neuralab Safe Concurrency Engine (Rust) ---</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">[Worker] Received sequence #0: 4 bytes verified</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">[Worker] Received sequence #1: 4 bytes verified</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">[Worker] Received sequence #2: 4 bytes verified</span><br>`;
            terminal.innerHTML += `<span style="color:var(--accent-green);">[Borrow Checker] Zero data races detected. Exit code 0.</span><br>`;
          } else if (currentFile === 'attention.py') {
            terminal.innerHTML += `<span style="color:#60a5fa;">[python 3.13-free-threaded] Executing attention.py</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">[Transformer Core] Attention matrix computed (2x2)</span><br>`;
            terminal.innerHTML += `<span style="color:#a7f3d0;">[Sparsity] Attention weight (0,0): 0.5498</span><br>`;
            terminal.innerHTML += `<span style="color:var(--accent-green);">&gt; Process finished with exit code 0</span><br>`;
          }
          terminal.scrollTop = terminal.scrollHeight;
        }, 300);
      }
    });
  </script>
</body>
</html>
